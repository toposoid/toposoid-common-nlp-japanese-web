name: Test And Build
on:
  workflow_call:
env:
  PJ_ACTOR: toposoid
  PJ_REPO: toposoid-common-nlp-japanese-web
  PJ_BRANCH: feature
  PJ_VERSION: 0.7-SNAPSHOT
jobs:
  unit-test_toposoid-common-nlp-japanese-web-arm64:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Clone ${{ env.PJ_REPO }}
        uses: actions/checkout@v4
        with:
            repository: ${{ env.PJ_ACTOR }}/${{ env.PJ_REPO }}
      - name: Execute tests
        run: |
            cd ${GITHUB_WORKSPACE} && cd ../
            cd ./${{ env.PJ_REPO }}
            docker rm --force $(docker ps -a -q) > /dev/null 2>&1 && :
            docker rmi --force ${{ env.PJ_REPO }}:${{ env.PJ_VERSION }} > /dev/null 2>&1 && :
            docker rmi --force toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }} > /dev/null 2>&1 && :
            docker rmi --force toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}-lowspec > /dev/null 2>&1 && :
            docker images
            docker system prune -f
            docker volume prune -f
            docker build --build-arg TARGET_BRANCH=${{ env.PJ_BRANCH }} --build-arg BASE_IMAGE_LABEL=0.7-lowspec --build-arg SPEC_LEVEL=-lowspec --build-arg SENTENCE_TRANSFORMER_MODEL=paraphrase-multilingual-MiniLM-L12-v2 --build-arg VECTOR_MODEL=90 --tag ${{ env.PJ_REPO }}:${{ env.PJ_VERSION }} --load -f Dockerfile-workflow .
            docker compose -f docker-compose-workflow.yml up -d
            docker compose -f docker-compose-workflow.yml exec -T ${{ env.PJ_REPO }} bash -c "cd ${{ env.PJ_REPO }} && pytest"
            docker rm --force $(docker ps -a -q) > /dev/null 2>&1 && :
            docker rmi --force ${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}
      - name: Docker meta
        id: docker_meta
        uses: crazy-max/ghaction-docker-meta@v5
        with:
          images: toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}
      - name: Login to CR
        uses: docker/login-action@v3
        with:
          username: toposoid
          password: ${{ secrets.CR_TOKEN }}
      - name: Build And Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}-arm64
          build-args: |
            TARGET_BRANCH=${{ env.PJ_BRANCH }}
            SENTENCE_TRANSFORMER_MODEL=paraphrase-multilingual-mpnet-base-v2
            VECTOR_MODEL=15
            BASE_IMAGE_LABEL=0.7
      - name: Build And Push Docker Image For Test
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: toposoid/${{ env.PJ_REPO }}:${{ env.PJ_VERSION }}-lowspec-arm64
          build-args: |
            TARGET_BRANCH=${{ env.PJ_BRANCH }}
            SENTENCE_TRANSFORMER_MODEL=paraphrase-multilingual-MiniLM-L12-v2
            VECTOR_MODEL=90
            BASE_IMAGE_LABEL=0.7-lowspec

